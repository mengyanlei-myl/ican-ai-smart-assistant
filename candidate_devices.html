<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选设备 - 低空选型系统</title>
    <style>
        /* ...复用样式，增加设备卡片样式... */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 3px solid #2a7de1; }
        .header h1 { margin: 0; color: #1a2b4c; }
        .header .badge { background: #2a7de1; color: white; padding: 6px 16px; border-radius: 30px; font-size: 14px; }
        .category-section { margin: 30px 0; }
        .category-title { font-size: 22px; font-weight: 600; color: #1a2b4c; margin-bottom: 15px; padding-left: 10px; border-left: 5px solid #2a7de1; }
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .device-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid #2a7de1; transition: transform 0.1s; }
        .device-card.rejected { border-top-color: #e74c3c; opacity: 0.7; }
        .device-card .model { font-size: 18px; font-weight: 700; color: #1a2b4c; }
        .device-card .brand { color: #5d6d7e; font-size: 14px; }
        .device-card .specs { margin: 12px 0; font-size: 14px; line-height: 1.6; color: #2c3e50; }
        .device-card .specs span { background: #f0f4f8; padding: 2px 10px; border-radius: 12px; margin-right: 6px; display: inline-block; margin-bottom: 4px; }
        .device-card .status { display: inline-block; padding: 4px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; margin-top: 8px; }
        .status-pass { background: #d5f5e3; color: #1a7a42; }
        .status-fail { background: #fadbd8; color: #922b21; }
        .device-card .reason { font-size: 13px; color: #e74c3c; margin-top: 6px; background: #fef9e7; padding: 6px 10px; border-radius: 6px; }
        .device-card .source { font-size: 12px; color: #95a5a6; margin-top: 10px; border-top: 1px solid #ecf0f1; padding-top: 8px; }
        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
        .summary-bar { background: #1a2b4c; color: white; padding: 15px 25px; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 25px; }
        .summary-bar span { font-weight: 300; }
        .summary-bar strong { font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 候选设备</h1>
            <span class="badge">基于真实数据 (100+ 型号)</span>
        </div>

        <!-- 需求摘要条 -->
        <div class="summary-bar" id="summaryBar">
            <span>📋 任务: <strong>电力巡检</strong></span>
            <span>💰 预算: <strong>¥50,000</strong></span>
            <span>⏱️ 续航 ≥ <strong>45min</strong></span>
            <span>📦 载荷 ≤ <strong>2.0kg</strong></span>
            <span>🔧 功能: <strong>热成像, RTK</strong></span>
        </div>

        <!-- 设备列表容器 -->
        <div id="deviceList">
            <!-- 各分类由 JavaScript 动态生成 -->
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 模拟真实数据 (从成员一的 Excel 中提取关键字段)
        //    实际项目: 这些数据将通过 API 从后端数据库获取
        // ============================================================
        const mockDatabase = {
            drones: [
                { id: 'UAV-DJI-M400', brand: 'DJI', model: 'Matrice 400', type: '多旋翼', maxPayload: 6.0, flightTime: 59, price: 45000, weight: 6.0, features: ['RTK定位', '激光测距', '视觉感知'], source: 'DJI官网', protection: 'IP55', temp: '-20~50' },
                { id: 'UAV-DJI-M350RTK', brand: 'DJI', model: 'Matrice 350 RTK', maxPayload: 2.7, flightTime: 55, price: 58000, weight: 6.47, features: ['RTK定位', '多云台'], source: 'DJI官网', protection: 'IP55' },
                { id: 'UAV-DJI-M4T', brand: 'DJI', model: 'Matrice 4T', maxPayload: 0.2, flightTime: 49, price: 32000, weight: 1.229, features: ['热成像', 'RTK定位', '激光测距'], source: 'DJI官网', protection: 'IP55' },
                { id: 'UAV-AUTEL-ALPHA', brand: 'Autel', model: 'Alpha', maxPayload: 1.0, flightTime: 45, price: 48000, weight: 6.48, features: ['热成像', 'RTK定位', '激光测距'], source: 'Autel官网', protection: 'IP55' },
                { id: 'UAV-AUTEL-MAX4T2', brand: 'Autel', model: 'EVO Max 4T V2', maxPayload: 0.3, flightTime: 42, price: 28000, weight: 1.665, features: ['热成像', 'RTK定位'], source: 'Autel官网', protection: 'IP43' },
                { id: 'UAV-JOUAV-CW15', brand: 'JOUAV', model: 'CW-15', type: '垂直起降固定翼', maxPayload: 3.0, flightTime: 180, price: 120000, weight: 12.0, features: ['RTK定位'], source: 'JOUAV官网' },
                { id: 'UAV-SKYDIO-X10', brand: 'Skydio', model: 'X10', maxPayload: 0.5, flightTime: 40, price: 35000, weight: 2.49, features: ['热成像', 'RTK定位', '激光测距'], source: 'Skydio官网', protection: 'IP55' },
                { id: 'UAV-IFLIGHT-IF800', brand: 'Inspired Flight', model: 'IF800 Tomcat', maxPayload: 3.0, flightTime: 54, price: 42000, weight: 4.2, features: ['RTK定位'], source: 'Inspired Flight官网', protection: 'IP43' },
                { id: 'UAV-PARROT-USA', brand: 'Parrot', model: 'ANAFI USA', maxPayload: 0.1, flightTime: 32, price: 18000, weight: 0.5, features: ['热成像'], source: 'Parrot官网' },
            ],
            sensors: [
                // 可见光相机
                { id: 'SENS-BASLER-ACE2', brand: 'Basler', model: 'ace 2', category: '可见光相机', weight: 0.1, price: 3000, features: ['高分辨率'], source: 'Basler官网', resolution: '5MP', interface: 'GigE' },
                { id: 'SENS-HIKROBOT-MV', brand: 'Hikrobot', model: 'MV-CA', category: '可见光相机', weight: 0.15, price: 2500, features: ['工业检测'], source: 'Hikrobot官网' },
                // 热成像
                { id: 'SENS-FLIR-BOSON', brand: 'FLIR', model: 'Boson 640', category: '热成像相机', weight: 0.2, price: 4500, features: ['热成像', '640x512'], source: 'FLIR官网', resolution: '640x512' },
                { id: 'SENS-FLIR-LEPTON', brand: 'FLIR', model: 'Lepton 3.5', category: '热成像相机', weight: 0.05, price: 1200, features: ['热成像', '160x120'], source: 'FLIR官网' },
                // 激光雷达
                { id: 'LIDAR-LIVOX-MID360', brand: 'Livox', model: 'Mid-360', category: '激光雷达', weight: 0.265, price: 7000, features: ['激光雷达', '360°'], source: 'Livox官网', range: '40m' },
                { id: 'LIDAR-OUSTER-OS1', brand: 'Ouster', model: 'OS1', category: '激光雷达', weight: 0.5, price: 12000, features: ['激光雷达', '360°', '64线'], source: 'Ouster官网' },
                // 定位设备 (RTK/IMU)
                { id: 'GPS-UBLOX-F9P', brand: 'u-blox', model: 'ZED-F9P', category: 'RTK GNSS', weight: 0.02, price: 800, features: ['RTK定位', '厘米级'], source: 'u-blox官网' },
                { id: 'GPS-VECTORNAV-VN200', brand: 'VectorNav', model: 'VN-200', category: 'GNSS/INS', weight: 0.025, price: 2500, features: ['RTK定位', '惯导'], source: 'VectorNav官网' },
            ],
            computers: [
                { id: 'CP-NVIDIA-AGXORIN64', brand: 'NVIDIA', model: 'Jetson AGX Orin 64GB', cpu: '12核 Arm', gpu: 'Ampere', compute: '275 TOPS', weight: 0.1, price: 6000, power: '60W', features: ['AI计算', '275 TOPS'], source: 'NVIDIA官网' },
                { id: 'CP-NVIDIA-ORINNX16', brand: 'NVIDIA', model: 'Jetson Orin NX 16GB', cpu: '8核 Arm', gpu: 'Ampere', compute: '157 TOPS', weight: 0.05, price: 2500, power: '40W', features: ['AI计算', '157 TOPS'], source: 'NVIDIA官网' },
                { id: 'CP-RPI-CM5', brand: 'Raspberry Pi', model: 'Compute Module 5', cpu: '4核 Cortex-A76', compute: 'CPU only', weight: 0.02, price: 800, power: '10W', features: ['通用计算', '无NPU'], source: 'Raspberry Pi官网' },
                { id: 'CP-RADXA-ROCK5B', brand: 'Radxa', model: 'ROCK 5B', cpu: '8核 RK3588', gpu: 'Mali-G610', compute: '6 TOPS', weight: 0.08, price: 1200, power: '15W', features: ['AI计算', '6 TOPS'], source: 'Radxa官网' },
            ]
        };

        // ============================================================
        // 2. 硬筛选逻辑 (模拟成员二的筛选规则)
        // ============================================================
        const userRequirements = {
            budget: 50000,
            minFlightTime: 45,
            maxPayload: 2.0,
            requiredFunctions: ['热成像', 'RTK定位'],
            environment: 'general'
        };

        function evaluateDrone(drone) {
            let pass = true;
            let reasons = [];

            // 价格检查
            if (drone.price > userRequirements.budget) {
                pass = false;
                reasons.push(`价格 ${drone.price} 元超出预算 ${userRequirements.budget} 元`);
            }
            // 载荷检查 (有些无人机没有明确载荷，视为0)
            const payload = drone.maxPayload || 0;
            if (payload > userRequirements.maxPayload) {
                pass = false;
                reasons.push(`最大载荷 ${payload}kg 超过限制 ${userRequirements.maxPayload}kg`);
            }
            // 续航检查
            if (drone.flightTime && drone.flightTime < userRequirements.minFlightTime) {
                pass = false;
                reasons.push(`续航 ${drone.flightTime}min 低于最低要求 ${userRequirements.minFlightTime}min`);
            }
            // 必需功能检查
            const missingFunctions = userRequirements.requiredFunctions.filter(f => !(drone.features || []).includes(f));
            if (missingFunctions.length > 0) {
                pass = false;
                reasons.push(`缺少必需功能: ${missingFunctions.join(', ')}`);
            }

            return { pass, reasons: reasons.join('; ') || '满足所有基本要求' };
        }

        function evaluateSensor(sensor) {
            let pass = true;
            let reasons = [];
            // 价格检查 (传感器通常不单独限制，但这里简化)
            if (sensor.price > userRequirements.budget * 0.4) { // 假设传感器不超过预算40%
                pass = false;
                reasons.push(`价格 ${sensor.price} 元过高`);
            }
            // 功能检查
            const missingFunctions = userRequirements.requiredFunctions.filter(f => (sensor.features || []).includes(f));
            // 如果传感器没有匹配任何必需功能，视为不通过（但热成像和RTK通常由不同设备提供，这里宽松处理）
            // 更合理：如果用户需要热成像，则热成像相机通过，其他传感器不强制
            if (sensor.category === '热成像相机' && !userRequirements.requiredFunctions.includes('热成像')) {
                // 如果用户不需要热成像，但它是热成像相机，则不强制推荐
            }
            return { pass, reasons: reasons.join('; ') || '满足基本要求' };
        }

        function evaluateComputer(computer) {
            let pass = true;
            let reasons = [];
            if (computer.price > userRequirements.budget * 0.3) {
                pass = false;
                reasons.push(`价格 ${computer.price} 元过高`);
            }
            return { pass, reasons: reasons.join('; ') || '满足基本要求' };
        }

        // ============================================================
        // 3. 生成设备卡片HTML
        // ============================================================
        function renderDeviceCards(category, devices, evaluator) {
            if (!devices || devices.length === 0) {
                return `<div style="color: #95a5a6; padding: 10px;">暂无该类别设备</div>`;
            }

            let html = `<div class="device-grid">`;
            devices.forEach(device => {
                const result = evaluator(device);
                const statusClass = result.pass ? 'status-pass' : 'status-fail';
                const statusText = result.pass ? '✅ 推荐' : '❌ 淘汰';
                const cardClass = result.pass ? '' : 'rejected';

                html += `
                    <div class="device-card ${cardClass}">
                        <div class="model">${device.model}</div>
                        <div class="brand">${device.brand}</div>
                        <div class="specs">
                            ${device.weight ? `<span>⚖️ ${device.weight}kg</span>` : ''}
                            ${device.price ? `<span>💰 ¥${device.price}</span>` : ''}
                            ${device.flightTime ? `<span>⏱️ ${device.flightTime}min</span>` : ''}
                            ${device.maxPayload ? `<span>📦 ${device.maxPayload}kg</span>` : ''}
                            ${device.compute ? `<span>🧠 ${device.compute}</span>` : ''}
                            ${device.resolution ? `<span>📷 ${device.resolution}</span>` : ''}
                            ${device.range ? `<span>📏 ${device.range}</span>` : ''}
                            ${(device.features || []).slice(0, 3).map(f => `<span>🏷️ ${f}</span>`).join('')}
                        </div>
                        <div>
                            <span class="status ${statusClass}">${statusText}</span>
                        </div>
                        ${!result.pass ? `<div class="reason">⚠️ ${result.reasons}</div>` : ''}
                        <div class="source">📎 来源: ${device.source || '未标注'}</div>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        // ============================================================
        // 4. 渲染全部类别
        // ============================================================
        function renderAll() {
            const container = document.getElementById('deviceList');
            
            // 无人机
            let html = `<div class="category-section"><div class="category-title">🚁 候选无人机</div>`;
            html += renderDeviceCards('无人机', mockDatabase.drones, evaluateDrone);
            html += `</div>`;

            // 传感器 - 按子类分组
            const sensorGroups = {
                '可见光相机': mockDatabase.sensors.filter(s => s.category === '可见光相机'),
                '热成像相机': mockDatabase.sensors.filter(s => s.category === '热成像相机'),
                '激光雷达': mockDatabase.sensors.filter(s => s.category === '激光雷达'),
                'RTK/IMU': mockDatabase.sensors.filter(s => s.category === 'RTK GNSS' || s.category === 'GNSS/INS'),
            };
            for (const [group, devices] of Object.entries(sensorGroups)) {
                html += `<div class="category-section"><div class="category-title">📷 ${group}</div>`;
                html += renderDeviceCards(group, devices, evaluateSensor);
                html += `</div>`;
            }

            // 计算平台
            html += `<div class="category-section"><div class="category-title">💻 候选计算平台</div>`;
            html += renderDeviceCards('计算平台', mockDatabase.computers, evaluateComputer);
            html += `</div>`;

            container.innerHTML = html;
        }

        // 执行渲染
        renderAll();
    </script>
</body>
</html>
