<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需求确认</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #2a7de1; padding-bottom: 15px; }
        h1 { color: #1a2b4c; }
        .badge { background: #27ae60; color: white; padding: 6px 20px; border-radius: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }
        .item { background: #f8f9fa; padding: 18px 20px; border-radius: 10px; border-left: 5px solid #2a7de1; }
        .item label { font-size: 13px; color: #7f8c8d; font-weight: 600; display: block; margin-bottom: 5px; }
        .item .value { font-size: 18px; font-weight: 500; color: #1a2b4c; }
        .info { background: #fef9e7; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #f1c40f; margin: 20px 0; }
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        .btn-back { background: #ecf0f1; color: #2c3e50; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-next { background: #2a7de1; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; flex: 2; }
        .btn-next:hover { background: #1a5fb4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 需求确认</h1>
            <span class="badge">✅ 已解析</span>
        </div>
        <p style="color: #5d6d7e; margin: 15px 0;">请确认以下参数，如有误可返回修改</p>

        <div class="grid">
            <div class="item"><label>📝 任务描述</label><div class="value" id="v-taskDesc">—</div></div>
            <div class="item"><label>💰 预算</label><div class="value" id="v-budget">—</div></div>
            <div class="item"><label>⏱️ 最低续航</label><div class="value" id="v-flightTime">—</div></div>
            <div class="item"><label>📦 最大载荷</label><div class="value" id="v-payload">—</div></div>
            <div class="item"><label>🔧 必需功能</label><div class="value" id="v-functions">—</div></div>
            <div class="item"><label>🌦️ 工作环境</label><div class="value" id="v-environment">—</div></div>
            <div class="item"><label>🎯 优先目标</label><div class="value" id="v-priority">—</div></div>
        </div>

        <div class="info">💡 系统将从真实设备数据库中筛选匹配型号</div>

        <div class="btn-group">
            <button class="btn-back" onclick="history.back()">← 返回修改</button>
            <button class="btn-next" onclick="goToCandidates()">🔍 查看候选设备 →</button>
        </div>
    </div>

    <script>
        const req = JSON.parse(localStorage.getItem('requirements') || '{}');

        document.getElementById('v-taskDesc').textContent = req.taskDesc || '—';
        document.getElementById('v-budget').textContent = req.budget ? '¥' + req.budget : '—';
        document.getElementById('v-flightTime').textContent = req.minFlightTime ? req.minFlightTime + ' 分钟' : '—';
        document.getElementById('v-payload').textContent = req.maxPayload ? req.maxPayload + ' kg' : '—';
        document.getElementById('v-functions').textContent = (req.requiredFunctions || []).join(', ') || '无';
        document.getElementById('v-environment').textContent = req.environment || '通用';
        document.getElementById('v-priority').textContent = req.priority || '均衡';

        function goToCandidates() {
            const params = new URLSearchParams();
            if (req.budget) params.append('budget', req.budget);
            if (req.maxPayload) params.append('maxPayload', req.maxPayload);
            if (req.minFlightTime) params.append('minFlightTime', req.minFlightTime);
            if (req.requiredFunctions && req.requiredFunctions.length > 0) {
                params.append('functions', req.requiredFunctions.join(','));
            }
            window.location.href = 'candidate_devices.html?' + params.toString();
        }
    </script>
</body>
</html>
